<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Калькулятор розміру на карт</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style2.css">
  <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">Калькулятор розміру карт</header>


  <main id="infopage" class="layout">

    <aside id="leftBlock" class="col sidebar"><nav id="toc"></nav></aside>

    <article class="col content">
    <h2>Калькулятор розміру карт у Mindustry</h2>
    Надішліть скріншот карти для обчислення розміру:<br>
    <input type="file"><br>
    <div id="output" class="result" aria-live="polite"></div>
    </article>

    <aside class="col sidebar"><nav id="sitemap">
  <ul>
  </ul>
</nav>
</aside>
  </main>
    <script>
(function(){
  const content = document.querySelector('#infopage');
  const toc = document.querySelector('#toc');
  if(!content || !toc) return;
  const headings = content.querySelectorAll('h1,h2,h3,h4'); // choose selectors
  headings.forEach((h, i) => {
    if(!h.id) h.id = 'toc-' + (h.textContent.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^\w-]/g,'') || i);
    // const link = document.createElement('a');

        const link = document.createElement('a');
// ... set href/text/className as before
const wrap = document.createElement('div');
wrap.className = 'toc-item';
wrap.appendChild(link);
toc.appendChild(wrap);

    link.href = '#' + h.id;
    link.textContent = h.textContent;
    link.className = 'toc-link toc-' + h.tagName.toLowerCase();
    toc.appendChild(link);



  });
})();
</script>
<script src="hcc.js"></script>



  <footer class="site-footer">Bottom of the page</footer>

</body>
</html>
